# Curl Runner - Application Configuration

# Disable web server (desktop Swing application)
spring.main.web-application-type=none

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:curlrunner;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JDBC - Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 Console (disabled - desktop application)
spring.h2.console.enabled=false
